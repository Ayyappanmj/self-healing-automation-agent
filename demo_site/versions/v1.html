<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="ui-version" content="v1">
<title>Demo Login v1</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="card">
<h1>Sign in</h1>
<form>
  <label for="username">Username</label>
  <input id="username" type="text" placeholder="Username">
  <label for="password">Password</label>
  <input id="password" type="password" placeholder="Password">
  <label class="check"><input id="remember" type="checkbox"> Remember me</label>
  <button id="login" type="submit">Login</button>
  <a id="forgot" href="#">Forgot password?</a>
</form>
<p id="welcome" class="status" hidden></p>
</main><script src="/app.js"></script></body></html>
